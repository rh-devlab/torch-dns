name: Build TORCH Root DNS

on:
  push:
    branches:
      - main
    paths:
      - 'domains/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile all .torch domains into master registry
        run: |
          mkdir -p public
          node -e '
            const fs = require("fs");
            const path = require("path");
            const domainsDir = "./domains";
            const master = {
              network: "TORCH",
              tld: ".torch",
              updated_at: new Date().toISOString(),
              records: {}
            };
            fs.readdirSync(domainsDir).forEach(file => {
              if (file.endsWith(".json")) {
                const data = JSON.parse(fs.readFileSync(path.join(domainsDir, file), "utf8"));
                master.records[data.domain] = data.record.target;
              }
            });
            fs.writeFileSync("./public/all-domains.json", JSON.stringify(master, null, 2));
          '

      - name: Deploy DNS Registry to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
