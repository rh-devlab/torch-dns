name: Build TORCH Root DNS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile Root DNS & Copy Portals
        run: |
          python3 -c '
          import json, glob, os, shutil
          from datetime import datetime, timezone

          records = {}
          for path in sorted(glob.glob("domains/*.json")):
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
                  domain = data.get("domain", "").lower().strip()
                  target = data.get("record", {}).get("target", "").strip()
                  if domain.endswith(".torch") and target:
                      records[domain] = target

          output = {
              "network": "TORCH",
              "tld": ".torch",
              "updated_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "records": records
          }

          os.makedirs("dist", exist_ok=True)
          with open("dist/all-domains.json", "w", encoding="utf-8") as out:
              json.dump(output, out, indent=2)

          if os.path.exists("portal.html"):
              shutil.copy("portal.html", "dist/portal.html")

          if os.path.exists("forge.html"):
              shutil.copy("forge.html", "dist/forge.html")
          '

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
